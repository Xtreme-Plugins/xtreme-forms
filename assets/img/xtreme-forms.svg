<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <!-- Clipboard icon -->
  <rect x="2" y="6" width="44" height="44" rx="7" fill="#1a1d1e"/>
  <!-- Clipboard clip -->
  <rect x="18" y="4" width="12" height="7" rx="2" fill="#2d3436"/>
  <rect x="18" y="4" width="12" height="7" rx="2" fill="url(#clip)"/>
  <!-- Form field rows -->
  <rect x="10" y="16" width="28" height="4" rx="1" fill="url(#row1)"/>
  <rect x="10" y="24" width="20" height="4" rx="1" fill="#2d3436"/>
  <rect x="10" y="32" width="28" height="4" rx="1" fill="url(#row2)"/>
  <!-- Check badge -->
  <circle cx="36" cy="42" r="5" fill="url(#check)"/>
  <path d="M33.5 42 L35.2 43.6 L38.5 40.4" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- XTREME wordmark -->
  <text x="56" y="33"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22"
        font-weight="800"
        letter-spacing="-0.5"
        fill="#1a1d1e">XTREME</text>

  <!-- FORMS sub-wordmark -->
  <text x="57" y="47"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="12"
        font-weight="600"
        letter-spacing="4"
        fill="#1a73e8">FORMS</text>

  <!-- Accent underline -->
  <rect x="56" y="50" width="42" height="2" rx="1" fill="url(#ul)"/>

  <defs>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="row1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="row2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec38bc"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ul" x1="56" y1="0" x2="98" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
</svg>
